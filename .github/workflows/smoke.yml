name: smoke

# Manual post-publish verification: consume the real ZmqSharp +
# ZmqSharp.Security.Curve packages from nuget.org with a dedicated consumer
# project (ZmqSharp.Smoke) and run a loopback PAIR exchange and a CURVE
# exchange. Kept out of the publish workflow: the feed is eventually
# consistent, and a freshly pushed version becomes visible only after an
# unbounded, unobservable delay — so smoke cannot run in lockstep with the
# release (it would fail on index lag, as it did on v0.4.0/v0.4.1). Trigger
# it manually once the version is confirmed available on nuget.org; a failure
# here flags a packaging problem that a release did not catch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published ZmqSharp version to verify, e.g. 0.5.0 (a leading "v" is stripped)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-smoke:
    # One OS is enough: the managed dll has no platform-specific code (no
    # P/Invoke), unlike Pty.Net.
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # for ZmqSharp.Smoke

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The consumer csproj defaults to 0.1.0 for local runs; the manual trigger
      # overrides it with the version being verified (a habitual "v0.5.0" input
      # is stripped to the bare version nuget restore expects).
      - name: Smoke test the published packages
        shell: pwsh
        run: dotnet run --project ZmqSharp.Smoke -c Release -p:ZmqSharpVersion=$("$env:VERSION" -replace '^v', '')
        env:
          VERSION: ${{ inputs.version }}
