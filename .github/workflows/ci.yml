name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes the in-flight CI run: the 3-job matrix
# is expensive, and only the latest commit's result matters for the merge gate.
# Tag-only pushes do not match the branches filter, so publish runs
# (tag-triggered) are never cancelled by this.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ZmqSharp.slnx

      - name: Build
        run: dotnet build ZmqSharp.slnx --no-restore --configuration Release

      - name: Format
        run: dotnet format ZmqSharp.slnx --verify-no-changes --no-restore

      - name: Test
        # MTP mode: the xunit v3 test assemblies are self-executing
        # Microsoft.Testing.Platform apps, so the VSTest-era --logger option no
        # longer exists. --report-trx (provided by
        # Microsoft.Testing.Extensions.TrxReport, referenced by each test
        # project) writes one .trx per project into TestResults.
        # --max-parallel-test-modules 1 keeps the projects serial, as they were
        # under VSTest: the allocation suite samples a thread-local GC counter
        # and is the suite most sensitive to a noisy, shared thread pool, and
        # hosted runners have few cores. Costs ~6s per matrix job.
        run: dotnet test ZmqSharp.slnx --no-build --configuration Release --report-trx --results-directory TestResults --max-parallel-test-modules 1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
