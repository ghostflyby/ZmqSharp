name: External consumer validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-validation:
    name: Native AOT & PLAIN interop (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare logs
        run: |
          mkdir -p "$RUNNER_TEMP/consumer-validation-logs"
          echo "CONSUMER_LOG_DIR=$RUNNER_TEMP/consumer-validation-logs" >> "$GITHUB_ENV"
          echo "CONSUMER_PUBLISH_DIR=$RUNNER_TEMP/consumer-validation-publish" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update 2>&1 | tee "$CONSUMER_LOG_DIR/apt-update.log"
          sudo apt-get install -y clang zlib1g-dev 2>&1 | tee "$CONSUMER_LOG_DIR/apt-install.log"

      - name: Install PLAIN reference implementation
        run: |
          python -m pip install --only-binary=:all: pyzmq==27.1.0 2>&1 | tee "$CONSUMER_LOG_DIR/python-install.log"
          python -c 'import sys, zmq; print(sys.version); print("pyzmq", zmq.__version__, "libzmq", zmq.zmq_version())' 2>&1 | tee "$CONSUMER_LOG_DIR/python-versions.log"

      - name: Build allocation measurement consumer
        run: dotnet build eng/measure-wire-allocations/Measure.csproj --configuration Release 2>&1 | tee "$CONSUMER_LOG_DIR/measure-build.log"

      - name: Verify engineering project formatting
        run: |
          dotnet restore eng/aot-smoke/Smoke.csproj 2>&1 | tee "$CONSUMER_LOG_DIR/smoke-restore.log"
          dotnet format eng/aot-smoke/Smoke.csproj --verify-no-changes --no-restore 2>&1 | tee "$CONSUMER_LOG_DIR/smoke-format.log"
          dotnet format eng/measure-wire-allocations/Measure.csproj --verify-no-changes --no-restore 2>&1 | tee "$CONSUMER_LOG_DIR/measure-format.log"

      - name: Publish Native AOT consumer
        run: dotnet publish eng/aot-smoke/Smoke.csproj --configuration Release --runtime linux-x64 --output "$CONSUMER_PUBLISH_DIR" 2>&1 | tee "$CONSUMER_LOG_DIR/aot-publish.log"

      - name: Run Native AOT consumer
        timeout-minutes: 3
        run: '"$CONSUMER_PUBLISH_DIR/Smoke" 2>&1 | tee "$CONSUMER_LOG_DIR/aot-run.log"'

      - name: Verify all PLAIN roles and topologies
        timeout-minutes: 3
        run: python eng/aot-smoke/verify-plain-interop.py "$CONSUMER_PUBLISH_DIR/Smoke" 2>&1 | tee "$CONSUMER_LOG_DIR/plain-interop.log"

      - name: Upload validation logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-validation-linux-x64
          path: ${{ env.CONSUMER_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 7
