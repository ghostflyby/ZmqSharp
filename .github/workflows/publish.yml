name: publish

# Tag-triggered release: push a vX.Y.Z tag (e.g. v0.1.0) to build, test, pack the
# two NuGet packages (ZmqSharp core + the optional ZmqSharp.Security.Curve) and
# publish them to nuget.org plus a GitHub release. The version is derived from the
# tag — the single source of truth — not from the csproj.
# Publish uses NuGet Trusted Publishing (OIDC): no long-lived API key in secrets; the
# short-lived key is exchanged by NuGet/login@v1. Register the matching policy on
# nuget.org (owner: ghostflyby, repo: ghostflyby/ZmqSharp, workflow file: publish.yml).
#
# Unlike Pty.Net there is no build matrix and no cross-platform nupkg assembly: the
# managed dll is identical on every OS (no P/Invoke, no per-OS file splits), so one
# build job and one nupkg per package is the whole flow.
on:
  push:
    tags: [ 'v*.*.*' ]

# A publish must never be cancelled mid-flight (a half-pushed release), and two pushes
# of the same tag cannot happen — but guard anyway: same-ref publishes serialize.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Every run: step uses pwsh (PowerShell Core), preinstalled on all GitHub-hosted
# runners, so the same script syntax works everywhere — no bash-isms anywhere.
defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build, test & pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Set version from tag
        run: |
          "VERSION=$( $env:GITHUB_REF_NAME -replace '^v', '' )" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # A release candidate must pass the full suite before anything ships.
      # No --nologo here: in Microsoft.Testing.Platform mode dotnet test forwards
      # unrecognized options to the test app, and the xunit v3 runner spells it
      # -noLogo, so --nologo aborts the run with exit code 5.
      - name: Test
        run: dotnet test ZmqSharp.slnx -c Release

      # Both packable projects get the tag version. Packing the Curve project pulls
      # the core project into the same version, so its nuspec dependency on ZmqSharp
      # matches the package pushed in this same run.
      - name: Pack
        run: |
          # The csproj enables IncludeSymbols/snupkg; pass them explicitly anyway so
          # the pack intent is visible here (--symbols as a CLI switch is parsed by
          # pwsh into MSBuild as an unknown switch and fails).
          dotnet pack ZmqSharp/ZmqSharp.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          dotnet pack ZmqSharp.Security.Curve/ZmqSharp.Security.Curve.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org + GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # id-token: write lets NuGet/login exchange the OIDC token for a short-lived
    # NuGet API key (Trusted Publishing); attestations: write persists the build
    # provenance attestation in the repository's attestation store; contents: write
    # is for gh release create. The API housekeeping PR runs in its own job with
    # its own narrow permissions, so no publishing step holds pull-requests: write.
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      # gh release create resolves the repository through git, so this job needs the
      # checkout even though it builds nothing (packages come from the build job).
      # Full history: the tag-on-main guard runs git merge-base --is-ancestor, and on
      # a shallow (depth-1) checkout the two commits share no common ancestor unless
      # the tag is exactly main's tip — a hotfix tag on an older main commit would be
      # falsely rejected.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pkg
          path: pkgs

      - name: Validate tag is SemVer and not a downgrade
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')
          {
            throw "tag '$env:GITHUB_REF_NAME' is not a valid vX.Y.Z[(-suffix)] version"
          }
          $candidateV = [semver]::new($version)
          "VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          # Refuse versions nuget.org already has, before anything is pushed. With
          # --skip-duplicate gone from the push this is the belt to its suspenders,
          # and it gives traceability-only tag pushes (a re-tag of a historical
          # version) a clear early exit instead of a push that cannot succeed.
          # Both packages: a partial previous release (core pushed, Curve not) must
          # not be silently re-pushed either.
          foreach ($id in 'zmqsharp', 'zmqsharp.security.curve')
          {
            $index = try
            {
              Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$id/index.json" -TimeoutSec 30
            }
            catch
            {
              $null
            }
            if ($index -and ($index.versions -contains $version))
            {
              throw "version '$version' of $id is already published on nuget.org — refusing to republish (traceability tag only)"
            }
          }
          # The tag commit must sit on main's history: a tag on a side branch or a
          # stray commit never reaches the production publish.
          git fetch origin main
          $onMain = $false
          try
          {
            git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main 2> $null
            $onMain = ($LASTEXITCODE -eq 0)
          }
          catch
          {
            $global:LASTEXITCODE = 0
            $onMain = $false
          }
          if (-not $onMain)
          {
            throw "tag commit $env:GITHUB_SHA is not an ancestor of origin/main"
          }
          # And its CI must have passed: a release rides on the commit the
          # three-platform suite ran against.
          $run = try
          {
            gh run list --workflow ci.yml --commit "$env:GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2> $null
          }
          catch
          {
            $global:LASTEXITCODE = 0
            $null
          }
          if (-not $run)
          {
            throw "no successful (completed) ci.yml run found for tag commit $env:GITHUB_SHA — merge first, wait for CI on main to go green, then tag"
          }
          Write-Host "ok: tag commit is on main with green CI (run $run)"
          # 'gh release list' exits 1 when no release exists yet (first publish); with
          # $PSNativeCommandUseErrorActionPreference = $true that becomes a terminating
          # error, so wrap it. The catch must also reset $LASTEXITCODE: pwsh exits the
          # script with the last external command's code, so a swallowed '1' would still
          # fail the step.
          $latest = try
          {
            gh release list --limit 1 --json tagName --jq '.[0].tagName' 2> $null
          }
          catch
          {
            $global:LASTEXITCODE = 0
            $null
          }
          if ($latest)
          {
            $latestV = $latest -replace '^v', ''
            $previousV = [semver]::new($latestV)
            if ($candidateV -le $previousV)
            {
              throw "version '$version' is not newer than the latest release '$latestV'"
            }
            Write-Host "ok: $version > $latestV"
          }
          else
          {
            Write-Host 'no previous release; this is the first publish'
          }
          # Normal path ends cleanly even if an external command left $LASTEXITCODE set;
          # throw paths above terminate with a non-zero exit before reaching here.
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify both packages are well-formed
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @("ZmqSharp.$env:VERSION.nupkg", "ZmqSharp.Security.Curve.$env:VERSION.nupkg")
          foreach ($name in $expected)
          {
            $path = "pkgs/$name"
            if (-not (Test-Path -LiteralPath $path))
            {
              throw "missing package: $name"
            }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $path))
            try
            {
              $dll = @($zip.Entries | Where-Object { $_.FullName -like 'lib/net10.0/*.dll' })
              $nuspec = @($zip.Entries | Where-Object { $_.FullName -like '*.nuspec' })
              if ($dll.Count -ne 1)
              {
                throw "${name}: expected 1 lib dll, found $( $dll.Count )"
              }
              if ($nuspec.Count -ne 1)
              {
                throw "${name}: expected 1 nuspec, found $( $nuspec.Count )"
              }
            }
            finally
            {
              $zip.Dispose()
            }
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            pkgs/ZmqSharp.${{ env.VERSION }}.nupkg
            pkgs/ZmqSharp.${{ env.VERSION }}.snupkg
            pkgs/ZmqSharp.Security.Curve.${{ env.VERSION }}.nupkg
            pkgs/ZmqSharp.Security.Curve.${{ env.VERSION }}.snupkg

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org username (profile name), not an email address. The temp key is
          # valid for 1 hour and is exchanged right before the push.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          dotnet nuget push "pkgs/ZmqSharp.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY"
          dotnet nuget push "pkgs/ZmqSharp.Security.Curve.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Create GitHub release
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" `
            --notes "ZmqSharp $env:VERSION — see https://www.nuget.org/packages/ZmqSharp/$env:VERSION and https://www.nuget.org/packages/ZmqSharp.Security.Curve/$env:VERSION for package details. Symbol packages (.snupkg) are on nuget.org; debuggers fetch them automatically." `
            "pkgs/ZmqSharp.$env:VERSION.nupkg" "pkgs/ZmqSharp.$env:VERSION.snupkg" `
            "pkgs/ZmqSharp.Security.Curve.$env:VERSION.nupkg" "pkgs/ZmqSharp.Security.Curve.$env:VERSION.snupkg"
        env:
          GH_TOKEN: ${{ github.token }}

  # Publish-time housekeeping: the API shipped in this release must move from
  # Unshipped to Shipped, so Shipped stays an accurate record of what is actually
  # published on nuget.org. The exact set is the Unshipped entries present on the
  # tag commit (this checkout), merged into main's Shipped and removed from main's
  # Unshipped — later additions on main stay unshipped. Both packable projects ride
  # one housekeeping branch and PR.
  #
  # A separate job with only contents/pull-requests write: it runs after the
  # release is already done, so a failure here never affects the published
  # packages, and the publishing steps never hold a PR-writing token.
  housekeeping:
    name: Move published API into Shipped
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Move published API into Shipped (housekeeping PR)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $projects = @('ZmqSharp', 'ZmqSharp.Security.Curve')

          # The working tree is the tag commit: its Unshipped entries are what shipped.
          $tagUnshippedByProject = @{}
          foreach ($project in $projects)
          {
            $tagUnshippedByProject[$project] = @(Get-Content "$project/PublicAPI.Unshipped.txt" | Where-Object { $_ -and -not $_.StartsWith('#') })
          }
          if (-not ($tagUnshippedByProject.Values | Where-Object { $_.Count -gt 0 }))
          {
            Write-Host 'no unshipped API on this tag; nothing to move'
            exit 0
          }
          git fetch origin main
          git checkout -b "housekeeping/shipped-v$version" FETCH_HEAD

          # The files are ordered by a case-insensitive ordinal sort of the whole
          # line; *REMOVED* is ignored for the key so a removal sorts next to the
          # symbol it removes. This is the order the analyzer's own fixer writes,
          # so promoting an unchanged entry stays a no-op in the diff.
          function Sort-ApiLines([string[]] $lines)
          {
            $items = [string[]]$lines.Clone()
            $keys = [string[]]@($items | ForEach-Object { $_ -replace '^\*REMOVED\*', '' })
            [Array]::Sort($keys, $items, [System.StringComparer]::OrdinalIgnoreCase)
            return ,$items
          }

          foreach ($project in $projects)
          {
            $tagUnshipped = $tagUnshippedByProject[$project]
            if ($tagUnshipped.Count -eq 0) { continue }
            $shippedPath = "$project/PublicAPI.Shipped.txt"
            $unshippedPath = "$project/PublicAPI.Unshipped.txt"
            # Keep every directive line (e.g. #nullable enable) verbatim.
            $shippedHeader = @(Get-Content $shippedPath | Where-Object { $_.StartsWith('#') })
            $unshippedHeader = @(Get-Content $unshippedPath | Where-Object { $_.StartsWith('#') })
            $shipped = @(Get-Content $shippedPath | Where-Object { $_ -and -not $_.StartsWith('#') })
            $unshipped = @(Get-Content $unshippedPath | Where-Object { $_ -and -not $_.StartsWith('#') })
            $removedPrefix = '*REMOVED*'
            $tagAdditions = @($tagUnshipped | Where-Object { -not $_.StartsWith($removedPrefix) })
            $tagRemovals = @($tagUnshipped | Where-Object { $_.StartsWith($removedPrefix) } | ForEach-Object { $_.Substring($removedPrefix.Length) })
            # Set operations are case-sensitive: symbol signatures are.
            $remainingShipped = @($shipped | Where-Object { $_ -cnotin $tagRemovals })
            $newShipped = Sort-ApiLines @(($remainingShipped + $tagAdditions) | Select-Object -Unique)
            $newUnshipped = Sort-ApiLines @($unshipped | Where-Object { $_ -cnotin $tagUnshipped })
            ((@($shippedHeader) + $newShipped) -join "`n") + "`n" | Set-Content -Path $shippedPath -NoNewline
            ((@($unshippedHeader) + $newUnshipped) -join "`n") + "`n" | Set-Content -Path $unshippedPath -NoNewline
            git add $shippedPath $unshippedPath
          }

          # A hotfix tag on an older main commit can name API main already promoted;
          # the rewrite is then a no-op and there is nothing to commit.
          if (-not (git status --porcelain))
          {
            Write-Host 'main already records this release; nothing to promote'
            exit 0
          }

          # The branch is pushed with GITHUB_TOKEN, whose events start no workflow
          # runs, so nothing else gates this merge. Build the rewritten files first:
          # RS0016 (an entry went missing) and RS0017 (an entry has no symbol) fail
          # the step, keeping a bad promotion off main.
          dotnet build ZmqSharp/ZmqSharp.csproj -c Release --nologo
          dotnet build ZmqSharp.Security.Curve/ZmqSharp.Security.Curve.csproj -c Release --nologo

          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' `
            commit -m "chore: move shipped API to Shipped for $env:GITHUB_REF_NAME"
          git push -u origin "housekeeping/shipped-v$version"
          gh pr create --base main --head "housekeeping/shipped-v$version" `
            --title "chore: move shipped API to Shipped for $env:GITHUB_REF_NAME" `
            --body "Publish-time housekeeping: the API shipped in $env:GITHUB_REF_NAME moves from Unshipped to Shipped (the entries present on the tag commit, both packable projects)."
          # Direct merge, not --auto: the branch is pushed with the repository's own
          # GITHUB_TOKEN, whose events start no workflow runs, so the PR never gains
          # checks and GitHub rejects auto-merge with "Pull request is in clean status".
          gh pr merge --merge
        env:
          GH_TOKEN: ${{ github.token }}
