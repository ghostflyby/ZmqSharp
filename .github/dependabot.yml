version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      test-packages:
        patterns:
          - "FluentAssertions"
          - "Microsoft.Testing.Extensions.*"
          - "xunit.v3"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
